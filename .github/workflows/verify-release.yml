name: Verify release

# Proves that the archive people download from GitHub Releases is the archive
# that works: it is fetched back, its checksum checked against the published
# one, its contents inspected and the integration suite run against it in a
# fresh WordPress + WooCommerce install. The suite comes from the tag of the
# release under test, so a release is judged by the expectations that shipped
# with it and re-verifying an older release stays meaningful.
#
# The three ways a release appears are all covered here:
#
#   * the Release workflow calls this workflow (workflow_call) after it has
#     attached the archive. This is the normal path, and it has to be a call:
#     GitHub does not start workflow runs from events caused by the repository's
#     own GITHUB_TOKEN, so `release: published` never fires for a release that
#     the Release workflow created;
#   * a release published by hand fires `release: published`. Such a release is
#     often published before its archive is uploaded, so the download step waits
#     for the asset instead of failing on the spot;
#   * any published release can be re-verified with a manual dispatch.

on:
  release:
    types:
      - published
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to verify (for example 1.1.0).'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (for example 1.1.0). Empty verifies the latest release.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLUGIN_SLUG: usd-to-toman-price-sync-for-woocommerce
  # Pinned helper revision: the commit that introduced the canonical helpers
  # (lib-archive-contract, server lifecycle, verify-archive, router) and is
  # known to be compatible with tag 1.1.1 expectations. Update when helpers
  # change; never use origin/main (mutable).
  PINNED_HELPERS_SHA: 8100b59ddfd0214bec863bb50b21bdc904d1f3e8
  # A release can be published before its archive is uploaded, so the download
  # waits for the asset. 30 attempts x 10s = five minutes, which is longer than
  # the Release workflow needs to build and attach the zip.
  ASSET_ATTEMPTS: '30'
  ASSET_DELAY: '10'

jobs:
  verify:
    name: Verify the published release
    runs-on: ubuntu-latest
    env:
      WP_PATH: ${{ github.workspace }}/wp
      # The release is only trustworthy if the REST routes answer over real
      # HTTP, which is the failure mode a broken upgrade shows an admin.
      USDTF_REQUIRE_HTTP_TESTS: '1'
    steps:
      - name: Resolve the published release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          # gh resolves its argument against the tag first and the release name
          # second, so 1.1.0 finds the release tagged v1.1.0 as well. A release
          # that is not there yet is not the same thing as an empty release:
          # report it instead of half running the suite.
          tag=""

          if [ -z "${REQUESTED_TAG}" ]; then
            echo "No tag requested, verifying the latest published release."
            tag="$(gh release view --json tagName --jq '.tagName' || true)"
          else
            for candidate in "${REQUESTED_TAG}" "${REQUESTED_TAG#v}" "v${REQUESTED_TAG#v}"; do
              if found="$(gh release view "${candidate}" --json tagName --jq '.tagName' 2>/dev/null)"; then
                tag="${found}"
                break
              fi
            done
          fi

          if [ -z "${tag}" ]; then
            if [ -z "${REQUESTED_TAG}" ]; then
              echo "::error::There is no published release to verify yet."
            else
              echo "::error::No published release found for ${REQUESTED_TAG}. Publish it first: the Release workflow builds the archive and attaches it."
            fi

            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Verifying the archive of ${tag}."

          {
            echo "### Release resolution"
            echo
            req_esc="$(printf '%s' "${REQUESTED_TAG:-latest}" | sed 's/`/\\`/g; s/|/\\|/g')"
            tag_esc="$(printf '%s' "$tag" | sed 's/`/\\`/g; s/|/\\|/g')"
            repo_esc="$(printf '%s' "$GH_REPO" | sed 's/`/\\`/g; s/|/\\|/g')"
            echo "- **Requested**: \`${req_esc}\`"
            echo "- **Resolved**: \`${tag_esc}\`"
            echo "- **Repository**: \`${repo_esc}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the suite that shipped with the release
        # A release is verified with the suite of its own tag. Running today's
        # suite against an older archive would fail over changes made after the
        # release, which says nothing about whether the archive works.
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Check out pinned helpers (compatible revision)
        # Helpers are restored from an explicit pinned revision, not from
        # origin/main, so 1.1.1 keeps passing even after main moves. The SHA
        # above is the contract; bump it when helpers change. The checkout is
        # beneath GITHUB_WORKSPACE so every path stays inside the workspace.
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PINNED_HELPERS_SHA }}
          path: .pinned-helpers
          fetch-depth: 1

      - name: Restore helpers missing in older releases
        # 1.1.1 ships no server lifecycle or canonical validator; those helpers
        # were added after the tag. The suite that shipped with the release
        # still judges the archive, but the harness that drives it must be
        # present. When a helper is missing, it is restored from the pinned
        # helpers checkout above, not from the mutable origin/main.
        run: |
          set -euo pipefail
          missing=0
          for f in bin/verify-archive.php bin/lib-archive-contract.php tests/integration/setup.sh tests/integration/server.sh tests/integration/ci-run.sh tests/integration/router.php; do
            if [ ! -f "$f" ]; then
              echo "::warning::Helper $f missing at ${{ steps.release.outputs.tag }}, restoring from pinned $PINNED_HELPERS_SHA"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            for f in bin/verify-archive.php bin/lib-archive-contract.php tests/integration/setup.sh tests/integration/server.sh tests/integration/ci-run.sh tests/integration/router.php; do
              if [ ! -f "$f" ]; then
                if [ -f ".pinned-helpers/$f" ]; then
                  mkdir -p "$(dirname "$f")"
                  cp ".pinned-helpers/$f" "$f"
                  echo "Restored $f from pinned $PINNED_HELPERS_SHA"
                  chmod +x "$f" 2>/dev/null || true
                else
                  echo "::error::Helper $f missing at ${{ steps.release.outputs.tag }} and not found at pinned $PINNED_HELPERS_SHA:.pinned-helpers/$f"
                  exit 1
                fi
              fi
            done
          fi
          ls -l bin/verify-archive.php bin/lib-archive-contract.php tests/integration/setup.sh tests/integration/server.sh 2>&1 | head -n 10

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_sqlite, sqlite3, mbstring, zip
          tools: none

      - name: Download the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          attempt=1

          while :; do
            rm -rf dist
            mkdir -p dist

            # A release published by hand, or created by the Release workflow a
            # moment ago, can still be missing its archive. Assets do not appear
            # atomically either, hence the pair check below.
            gh release download "${tag}" \
              --pattern '*.zip' \
              --pattern '*.zip.sha256' \
              --dir dist \
              --clobber \
              || true

            if compgen -G 'dist/*.zip' > /dev/null && compgen -G 'dist/*.zip.sha256' > /dev/null; then
              break
            fi

            if [ "${attempt}" -ge "${ASSET_ATTEMPTS}" ]; then
              echo "::error::The release ${tag} has no *.zip and *.zip.sha256 pair after ${ASSET_ATTEMPTS} attempts ($((ASSET_ATTEMPTS * ASSET_DELAY))s). Assets found: $(gh release view "${tag}" --json assets --jq '[.assets[].name] | join(", ") | if . == "" then "none" else . end')"
              exit 1
            fi

            echo "Attempt ${attempt}/${ASSET_ATTEMPTS}: ${tag} has no archive to verify yet, waiting ${ASSET_DELAY}s."
            attempt=$((attempt + 1))
            sleep "${ASSET_DELAY}"
          done

          # Verifying one archive out of several would not prove anything, so an
          # ambiguous release is an error rather than a coin toss.
          zip_count="$(compgen -G 'dist/*.zip' | wc -l)"

          if [ "${zip_count}" -ne 1 ]; then
            echo "::error::The release ${tag} carries ${zip_count} *.zip archives, expected exactly one: $(compgen -G 'dist/*.zip' | tr '\n' ' ')"
            exit 1
          fi

          ls -l dist

          {
            echo "### Download"
            echo
            tag_esc="$(printf '%s' "$tag" | sed 's/`/\\`/g; s/|/\\|/g')"
            zip="$(ls dist/*.zip 2>/dev/null | head -n1 || echo "")"
            if [ -n "$zip" ]; then
              zip_base="$(basename "$zip" | sed 's/`/\\`/g; s/|/\\|/g')"
              zip_size="$(du -h "$zip" 2>/dev/null | cut -f1 | sed 's/`/\\`/g')"
              echo "- **Tag**: \`${tag_esc}\`"
              echo "- **Archive**: \`${zip_base}\` (${zip_size})"
              echo "- **Checksum file**: \`$(basename "$zip.sha256" 2>/dev/null | sed 's/`/\\`/g')\`"
            else
              echo "- **Tag**: \`${tag_esc}\`"
              echo "- **Archive**: not found"
            fi
            echo "- **Attempts**: ${attempt}/${ASSET_ATTEMPTS}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the checksum that was published with the release
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ./*.zip.sha256
          {
            echo "### Checksum"
            echo
            cfile="$(ls *.zip.sha256 2>/dev/null | head -n1 | sed 's/`/\\`/g; s/|/\\|/g' || echo "unknown")"
            cksum="$(cut -d' ' -f1 *.zip.sha256 2>/dev/null | head -c 16 | sed 's/`/\\`/g')"
            echo "- **File**: \`${cfile}\`"
            echo "- **Result**: ✅ matches"
            echo "- **Checksum**: \`${cksum}...\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect the archive (canonical)
        # Canonical validator replaces the duplicated inline grep chain. It
        # checks the top-level directory, forbidden files, required runtime
        # files, language catalogue, version header and JS namespace.
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          zip_file="$(ls dist/*.zip | head -n1)"
          php bin/verify-archive.php --zip="$zip_file" --version="$version"

      - name: Set up the integration environment from the release ZIP
        # Canonical setup: WordPress + WooCommerce + SQLite + wp-config + plugin from ZIP.
        run: bash tests/integration/setup.sh "$WP_PATH" --url=http://127.0.0.1:8888 --from-zip="$(ls dist/*.zip | head -n1)"

      - name: Start a web server for the real HTTP scenarios
        # Canonical lifecycle: PID tracked, health-probed, diagnostics on failure.
        # The suite of an older release may predate the router script, so a tag
        # without it is served the way its own CI served it (directly via index.php).
        run: |
          set -euo pipefail
          router="tests/integration/router.php"
          if [ ! -f "$router" ]; then
            router="$WP_PATH/index.php"
          fi
          bash tests/integration/server.sh start "$WP_PATH" "$router" 8888

      - name: Run the integration suite against the release
        id: suite
        run: |
          set -euo pipefail
          log="$(mktemp)"

          # Capture status explicitly for summary.
          set +e
          bash tests/integration/ci-run.sh "$WP_PATH" published-release 2>&1 | tee "${log}"
          status=$?
          set -e

          if grep -q '^skip - ' "${log}"; then
            echo "::error::The suite skipped scenarios, so the release is not verified:"
            grep '^skip - ' "${log}" || true
            exit 1
          fi

          {
            echo "### Verification"
            echo
            # Escape tag for markdown code span.
            tag_esc="$(printf '%s' "${{ steps.release.outputs.tag }}" | sed 's/`/\\`/g; s/|/\\|/g')"
            arch="$(basename "$(ls dist/*.zip 2>/dev/null | head -n1 || echo "unknown")" | sed 's/`/\\`/g; s/|/\\|/g')"
            echo "- **Suite**: \`published-release\` (tag \`${tag_esc}\`)"
            echo "- **Scenarios**: $(grep -c '^ok - ' "$log" 2>/dev/null || echo 0) passed"
            if [ "$status" -eq 0 ]; then
              echo "- **HTTP**: ✅ required and passed"
            else
              echo "- **HTTP**: ❌ failed (status ${status})"
            fi
            echo "- **Outcome**: \`${{ job.status }}\`"
            echo "- **Archive**: \`${arch}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Stop the web server
        if: always()
        run: bash tests/integration/server.sh stop 8888 || true

      - name: Show the debug and server logs when something failed
        if: failure()
        run: |
          echo "=== WordPress debug.log (${WP_PATH}/../debug.log) ==="
          [ -f "$WP_PATH/../debug.log" ] && tail -n 200 "$WP_PATH/../debug.log" || echo "(no debug.log)"
          echo
          echo "=== wp-content/debug.log ==="
          [ -f "$WP_PATH/wp-content/debug.log" ] && tail -n 200 "$WP_PATH/wp-content/debug.log" || echo "(no wp-content/debug.log)"
          echo
          bash tests/integration/server.sh status 8888 || true
