name: Debug Lint
on: push
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      - name: Run lint with verbose
        run: |
          echo "Running bin/lint.php"
          php bin/lint.php 2>&1 | tee /tmp/lint.log; status=\${PIPESTATUS[0]}
          echo "lint exit $status"
          echo "--- lint.log ---"
          cat /tmp/lint.log || true
          # Also create annotation with first 500 chars
          log_head=$(head -c 1000 /tmp/lint.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "::error::lint log: $log_head"
          echo "--- php -l all (first 200) ---"
          find . -name '*.php' -not -path './dist/*' -not -path './node_modules/*' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l 2>&1 | head -n 200 || true
          exit $status
