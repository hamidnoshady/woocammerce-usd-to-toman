name: Release

# The release archive is built from the tagged commit and attached to the
# release of that tag. Tag pushes do it on their own; a manual dispatch can
# (re)attach the archive for an existing tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build the release archive from (for example v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  upload:
    name: Build and attach the release zip
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: usd-to-toman-price-sync-for-woocommerce
    steps:
      - name: Work out the tag to release
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "::error::The tag to release must look like v1.2.3, got '$tag'."
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: none

      - name: Build the distribution
        run: php bin/build-dist.php --source-date="$(git log -1 --format=%cI)"

      - name: Validate the archive
        run: php bin/build-dist.php --check

      - name: Make sure no development file shipped
        run: |
          set -euo pipefail
          listing="$(unzip -Z1 dist/*.zip)"
          echo "$listing"
          if echo "$listing" | grep -Eq '^(tests|bin|\.github|wordpress-org)/|phpcs\.xml|composer\.(json|lock)|\.distignore|\.git'; then
            echo "::error::The distribution archive contains development files."
            exit 1
          fi
          top_level="$(echo "$listing" | cut -d/ -f1 | sort -u)"
          if [ "$top_level" != "${PLUGIN_SLUG}" ]; then
            echo "::error::The archive must contain exactly one top level directory named ${PLUGIN_SLUG}."
            exit 1
          fi

      - name: Check the shipped version markers
        run: |
          set -euo pipefail
          rm -rf dist/extracted
          mkdir -p dist/extracted
          unzip -q dist/*.zip -d dist/extracted
          php bin/check-versions.php --path="dist/extracted/${PLUGIN_SLUG}"

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG"; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.zip.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.zip.sha256 \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
