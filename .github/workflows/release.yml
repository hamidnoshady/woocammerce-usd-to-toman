name: Release

# Builds the clean distribution zip from a tagged source and publishes it as a
# GitHub release. The release is then verified by the "Verify release" workflow,
# which downloads the attached archive back and runs the integration suite
# against it: a release is only green when the archive people download works.
#
# Note that a release created here cannot trigger `release: published` on its
# own, because GitHub does not start workflow runs from events caused by this
# repository's GITHUB_TOKEN. That is why the verification is called from this
# workflow instead of waiting for the event.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example 1.0.0).'
        required: true
        type: string
      publish:
        description: 'Attach the zip to a GitHub release.'
        required: false
        default: true
        type: boolean
      svn:
        description: 'Also push the archive to the WordPress.org plugin directory.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLUGIN_SLUG: usd-to-toman-price-sync-for-woocommerce

jobs:
  release:
    name: Build and publish the release zip
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.release_tag }}
      zip: ${{ steps.version.outputs.zip }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: none

      - name: Read and verify the version
        id: version
        run: |
          set -euo pipefail
          version="$(php -r 'preg_match("/Version:\s*([\d.]+)/", file_get_contents("usd-to-toman-price-sync-for-woocommerce.php"), $m); echo $m[1];')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The version marker and the tag have to agree, but the tag may carry
          # the usual v prefix: the release is published under the tag that was
          # pushed, so 1.1.0 and v1.1.0 both work and the release is never left
          # empty because the archive was named after the other spelling.
          if [ "${{ github.event_name }}" = 'push' ]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${{ inputs.tag }}"
          fi

          if [ "${release_tag#v}" != "$version" ]; then
            echo "::error::The tag ${release_tag} does not match the plugin version ${version}."
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "zip=dist/${PLUGIN_SLUG}.${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Check the source before packaging
        run: |
          php bin/lint.php
          php bin/make-pot.php --check
          php bin/make-mo.php --check

      - name: Build the clean distribution
        # The commit date is baked into the archive comment instead of the build
        # time, so rebuilding the same tag reproduces the same checksum.
        run: php bin/build-dist.php --source-date="$(git log -1 --format=%cI)"

      - name: Validate the distribution (canonical)
        # Canonical validator checks the single top-level directory, forbidden
        # files, required runtime files, language catalogue, version header and
        # the usdtf/v1 REST namespace. Replaces the duplicated inline grep chain.
        run: php bin/verify-archive.php --zip="dist/${PLUGIN_SLUG}.${{ steps.version.outputs.version }}.zip" --version="${{ steps.version.outputs.version }}"

      - name: Build summary
        id: build-summary
        if: always()
        run: |
          {
            echo "### Build"
            echo
            echo "- **Outcome**: \`${{ job.status }}\`"
            zip="dist/${PLUGIN_SLUG}.${{ steps.version.outputs.version }}.zip"
            if [ -f "$zip" ]; then
              zip_base="$(basename "$zip" | sed 's/`/\\`/g; s/|/\\|/g')"
              zip_size="$(du -h "$zip" 2>/dev/null | cut -f1 | sed 's/`/\\`/g')"
              cksum="$(cut -d' ' -f1 "$zip.sha256" 2>/dev/null | head -c 16 | sed 's/`/\\`/g')"
              ver="$(printf '%s' "${{ steps.version.outputs.version }}" | sed 's/`/\\`/g; s/|/\\|/g')"
              tag="$(printf '%s' "${{ steps.version.outputs.release_tag }}" | sed 's/`/\\`/g; s/|/\\|/g')"
              echo "- **Archive**: \`${zip_base}\` (${zip_size}, $(unzip -Z1 "$zip" 2>/dev/null | wc -l) files)"
              echo "- **Checksum**: \`${cksum}...\`"
              echo "- **Version**: \`${ver}\` (tag \`${tag}\`)"
              if [ "${{ job.status }}" = "success" ]; then
                echo "- **Validation**: ✅ canonical validator passed"
              else
                echo "- **Validation**: ❌ failed"
              fi
            else
              echo "- **Archive**: not found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the archive as a workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PLUGIN_SLUG }}-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      - name: Publish the GitHub release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          release_tag="${{ steps.version.outputs.release_tag }}"
          notes_file="dist/release-notes.md"

          {
            echo "WordPress plugin zip for version ${version}, built from the tagged source."
            echo
            echo "Install it through **Plugins → Add New → Upload Plugin**, or copy the extracted"
            echo "\`${PLUGIN_SLUG}\` directory into \`wp-content/plugins/\`."
            echo
            echo "Download: \`${PLUGIN_SLUG}.${version}.zip\`"
            echo "Checksum (\`sha256\`): \`$(cut -d' ' -f1 "dist/${PLUGIN_SLUG}.${version}.zip.sha256")\`"
            echo

            # Include the matching CHANGELOG section so the release describes
            # itself instead of only linking to the archive.
            if [ -f CHANGELOG.md ]; then
              section="$(awk -v version="${version}" '
                /^## / {
                  if (found) { exit }
                  if (index($0, version) > 0) { found = 1; next }
                }
                found { print }
              ' CHANGELOG.md)"

              if [ -n "${section//[[:space:]]/}" ]; then
                echo
                echo "$section"
              fi
            fi

            echo
            echo "Checksums:"
            echo
            echo '```'
            cat "dist/${PLUGIN_SLUG}.${version}.zip.sha256"
            echo '```'
          } > "$notes_file"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "dist/${PLUGIN_SLUG}.${version}.zip" "dist/${PLUGIN_SLUG}.${version}.zip.sha256" --clobber
            gh release edit "$release_tag" --title "$version" --notes-file "$notes_file"
          else
            gh release create "$release_tag" \
              "dist/${PLUGIN_SLUG}.${version}.zip" \
              "dist/${PLUGIN_SLUG}.${version}.zip.sha256" \
              --title "$version" \
              --notes-file "$notes_file" \
              --verify-tag
          fi

          {
            echo "### Publication"
            echo
            # Escape for markdown; repo is controlled but still escape.
            tag_esc="$(printf '%s' "$release_tag" | sed 's/`/\\`/g; s/|/\\|/g')"
            ver_esc="$(printf '%s' "$version" | sed 's/`/\\`/g; s/|/\\|/g')"
            cksum="$(cut -d' ' -f1 "dist/${PLUGIN_SLUG}.${version}.zip.sha256" 2>/dev/null | head -c 16 | sed 's/`/\\`/g')"
            echo "- **Release**: [\`${tag_esc}\`](https://github.com/${{ github.repository }}/releases/tag/${tag_esc})"
            echo "- **Archive**: \`dist/${PLUGIN_SLUG}.${ver_esc}.zip\`"
            echo "- **Checksum**: \`${cksum}\`"
            echo "- **Notes**: $(wc -l < "$notes_file" 2>/dev/null | tr -d '\`' | tr -d '|') lines"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the published release
    needs: release
    # The verification runs the suite against the archive that was just
    # attached, so it only applies when a release was published or refreshed in
    # this run.
    if: ${{ github.event_name == 'push' || inputs.publish }}
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  wordpress-org:
    name: Deploy to the WordPress.org plugin directory
    runs-on: ubuntu-latest
    needs: release
    # Publishing to the plugin directory is a separate, explicit opt-in: run the
    # workflow manually with "svn" enabled, provide the SVN credentials in a
    # protected environment, and the same zip that was attached to the GitHub
    # release is pushed to trunk and tagged there. Re-running the workflow just
    # to refresh a release never touches WordPress.org.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.svn }}
    environment: wordpress-org
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: none

      - name: Build the clean distribution
        run: php bin/build-dist.php --source-date="$(git log -1 --format=%cI)"

      - name: Unpack the archive that will be deployed
        run: |
          set -euo pipefail
          mkdir -p build
          unzip -q "dist/${PLUGIN_SLUG}.${{ needs.release.outputs.version }}.zip" -d build
          ls -la "build/${PLUGIN_SLUG}"

      - name: Push trunk and the release tag to WordPress.org
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SVN_USERNAME}" ] || [ -z "${SVN_PASSWORD}" ]; then
            echo "::error::Set the SVN_USERNAME and SVN_PASSWORD secrets to publish to WordPress.org."
            exit 1
          fi

          version="${{ needs.release.outputs.version }}"
          svn_url="https://plugins.svn.wordpress.org/${PLUGIN_SLUG}"

          svn checkout "${svn_url}" svn --depth immediates --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}" --non-interactive
          svn update --set-depth infinity svn/trunk --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}" --non-interactive

          echo "Removing files that are no longer part of the plugin."
          find svn/trunk -mindepth 1 -maxdepth 1 -not -name '.svn' -exec rm -rf {} +

          echo "Copying the built distribution into trunk."
          cp -R "build/${PLUGIN_SLUG}/." svn/trunk/

          cd svn/trunk
          svn add --force . >/dev/null
          svn status

          svn commit -m "Release ${version}" --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}" --non-interactive

          cd ..
          if svn info "${svn_url}/tags/${version}" >/dev/null 2>&1; then
            echo "The tag ${version} already exists in the plugin directory, nothing to copy."
          else
            svn copy "${svn_url}/trunk" "${svn_url}/tags/${version}" \
              -m "Tag version ${version}" \
              --username "${SVN_USERNAME}" \
              --password "${SVN_PASSWORD}" \
              --non-interactive
          fi

      - name: Summary
        run: |
          {
            echo "### WordPress.org deployment"
            echo
            echo "Version \`${{ needs.release.outputs.version }}\` was pushed to the plugin directory."
            echo
            echo "The deployed files are the ones from the clean archive attached to the GitHub release."
          } >> "$GITHUB_STEP_SUMMARY"
